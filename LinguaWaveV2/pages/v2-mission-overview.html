<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same theme-flash-prevention snippet every page in this repo uses.
       Must stay first in <head>. -->
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#FFF8F0' : '#1F1712';
    })();
  </script>
  <!--
    LinguaWaveV2/pages/v2-mission-overview.html — V2 Mission Overview
    ─────────────────────────────────────────────────────────────────
    PURPOSE : Per the implementation guide's §6 (Mission Overview) /
              §5.1: mission number + title, goal, the signs you'll
              practice, an explicitly-labeled EFFORT ESTIMATE (never
              shown as if it were exact), the mastery requirement, and
              a live Mastery Hearts display — all sourced from
              window.LWDataV2 / window.LWData, no hardcoded copy.

    ENTRY   : ?mission=<categoryId> — matches the query param
              v2-dashboard.html's Continue card / journey rail and
              v2-learn.html's path rows already link with.

    HEARTS  : reads window.LWDataV2.getHeartsState() live. Guide §10's
              rule — "keep all learning activities available, gate
              only the next Mastery Quiz attempt" — is respected here:
              hitting 0 hearts disables ONLY the Start Mastery Quiz
              button. Start Mission (lesson/practice) always stays
              enabled regardless of heart count.

    KNOWN LIMITATION : the guide specifies consuming a heart on
              Mastery Quiz SUBMIT. pages/quiz.js is still deliberately
              untouched (repo-wide isolation rule for dataV2), so this
              page calls consumeHeartForMastery() when Start Mastery
              Quiz is clicked (attempt START) instead — see
              js/data-v2.js's file header for the full note and
              DataV2_LinguaWave_Progress_Tracker.md §5 open question 7.

    NOT BUILT HERE : the guide §6 "Know some already?" diagnostic
              challenge is shown as a disabled "Coming soon" button
              rather than faked with placeholder behavior.
    ─────────────────────────────────────────────────────────────────
  -->
