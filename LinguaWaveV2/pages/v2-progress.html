<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same theme-flash-prevention snippet every page in this repo uses.
       Must stay first in <head>. -->
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#FFF8F0' : '#1F1712';
    })();
  </script>
  <!--
    LinguaWaveV2/pages/v2-progress.html — V2 Progress page
    ─────────────────────────────────────────────────────────────────
    PURPOSE : Mission-based counterpart to pages/progress.html (the
              reference mockup's panel 10 — "Your Progress" ring +
              stat tiles, "Needs Review", "Progress by Level"). Same
              app shell as every other real V2 page (v2-dashboard.html
              / v2-learn.html / v2-mission-overview.html).

    DATA    : Sourced entirely from window.LWDataV2 (js/data-v2.js) —
              getAllMissions(), getMissionProgress(), getItemCompletedAt(),
              getStreakSummary(), getHeartsState(), getCategoryGroups() —
              plus window.LWData for sign titles. No hardcoded numbers.

    DIFFERENCES FROM THE MOCKUP, ON PURPOSE (same "don't fabricate
    data that doesn't exist" discipline js/progress-page.js documents
    for the v1 page):
      - "Progress by Level" -> "Progress by Chapter". dataV2 has no
        basic/medium/intermediate level grouping of its own (that's a
        js/data.js/js/engine/progress.js concept) — it organizes
        missions into the 12 named chapters from getCategoryGroups().
        Chapters with zero live missions built yet are left out rather
        than shown as a fake "0%".
      - "Needs Review": UNLIKE pages/progress.html (which has no
        timestamps and has to fall back to "most recently practiced"),
        dataV2 DOES record a real completedAt per item
        (getItemCompletedAt(), added Phase 2) — so this section shows
        signs whose LESSON item was actually completed 2+ days ago, a
        genuine (if simple) due rule, not a fabricated one. If nothing
        is old enough yet, the panel says so instead of padding the
        list with a made-up "3 days ago".
      - Two extra stat tiles beyond the mockup's three (Streak, Hearts)
        — both are real dataV2-only concepts (js/data-v2.js's streak
        and Hearts modules) already surfaced elsewhere in V2
        (v2-dashboard.html, v2-mission-overview.html); showing them
        here too keeps this page consistent with the rest of V2 rather
        than omitting data that already exists.

    CONNECTS : ← app sidebar (every real V2 page)
               → v2-mission-overview.html (chapter mission links)
               → pages/lesson.html (per-sign review links, same
                 pattern pages/progress.html's own review links use)
    ─────────────────────────────────────────────────────────────────
  -->

    <div class="app-main" id="v2-main">

      <section class="section section--sm section--tight">
        <div class="container">
          <h1>Your Progress</h1>
          <p class="text-muted mt-2">A full picture of how far you've come, mission by mission.</p>
        </div>
      </section>

      <section class="section section--sm">
        <div class="container">
          <div class="v2-progress-grid">

            <!-- ── LEFT COLUMN ─────────────────────────────────────── -->
            <div class="v2-progress-grid__main">

              <div class="v2-progress-hero-row" id="v2-progress-hero">
                <p class="text-muted loading-pulse">Loading your progress…</p>
              </div>

            </div>

            <!-- ── RIGHT COLUMN ────────────────────────────────────── -->
            <div class="v2-progress-grid__side">
              <div class="card v2-needs-review" id="v2-needs-review">
                <p class="text-muted loading-pulse">Loading review signs…</p>
              </div>
            </div>

          </div>
        </div>
      </section>

      <!-- "Progress by Chapter" (this session — moved OUT of the
           2-column grid above). It used to live inside
           .v2-progress-grid__main (the left column), which meant
           "center it" only centered it within that narrower column —
           once the right column's "Needs Review" list finished above
           it, there was a big empty gap beside it instead of it
           reading as centered on the PAGE. Now a full-width section of
           its own, so centering (heading via .text-center, card via
           its own max-width + margin-inline:auto — both already
           existed, just needed the right container) actually centers
           it against the page's real width. -->
      <section class="section section--sm section--tight">
        <div class="container text-center">
          <h2 class="mb-4">Progress by Chapter</h2>
          <div class="card unit-progress-list" id="v2-progress-chapters">
            <p class="text-muted loading-pulse" style="padding: var(--space-4);">Loading chapter-by-chapter progress…</p>
          </div>
        </div>
      </section>
