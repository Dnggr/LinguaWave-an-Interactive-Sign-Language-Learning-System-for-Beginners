<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#FFF8F0' : '#1F1712';
    })();
  </script>
  <!--
    LinguaWaveV2/pages/v2-learn.html — V2 Learning Path
    ─────────────────────────────────────────────────────────────────
    PURPOSE : "Your Learning Journey" list per the implementation
              guide's §4.3/§5 — heading, subtext, search field, then
              one ordered row per mission (number, title, one-line
              goal, status pill, progress, chevron). Sourced from
              window.LWDataV2.getAllMissions() — see v2-dashboard.html's
              header comment for the 65-vs-10-missions open question;
              this page shows all 65 live missions, not a hardcoded 10.

    ROW CLICK : each unlocked row currently links to the mission's
              existing quiz entry point (pages/quiz.html) as a
              stand-in "open this mission" destination — a real
              Mission Overview screen (guide §6) doesn't exist yet.
    ─────────────────────────────────────────────────────────────────
  -->
