<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same theme-flash-prevention snippet every page in this repo uses.
       Must stay first in <head>. -->
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#FFF8F0' : '#1F1712';
    })();
  </script>
  <!--
    LinguaWaveV2/pages/v2-dashboard.html — V2 Mission-Based Dashboard
    ─────────────────────────────────────────────────────────────────
    PURPOSE : First real (non-dev-only) page of the V2 rebuild, per
              "LinguaWave_V2_Mission_Based_Learning_System_
              Implementation_Guide.docx" §4.2 (base layout) and its
              V2 section §13 (Progress Dashboard) / the "Continue Your
              Mission" + "Today's Summary" + "Your Learning Journey"
              structure. Uses the SAME app shell (sidebar/header/.card
              tokens) as pages/dashboard.html so V2 looks like part of
              LinguaWave, not a separate tool — that's what "replicate
              the base format" means here, as opposed to the
              deliberately bare pages/datav2-preview.html /
              datav2-compare.html dev tools, which stay as-is.

    DATA    : Sourced live from window.LWDataV2.getAllMissions() (real
              content, all currently-live categories) — no hardcoded
              names/percentages, per the guide's explicit "do not show
              hardcoded values... before live data is ready" rule.

    OPEN QUESTION (see DataV2_LinguaWave_Progress_Tracker.md §5): the
              guide's V2 section asks for exactly 10 numbered missions;
              dataV2's schema currently has 65 (one per live category).
              This page does NOT collapse/renumber those 65 into 10 —
              that's a content decision for the team, not something to
              guess at silently. It shows all 65, ordered the same way
              getLiveCategoryList() already orders them.

    SCOPE   : Dashboard + Learn Path (v2-learn.html) only, this pass.
              Mission Overview / Lesson / Mastery Quiz / Review /
              Hearts (guide §6–12) are NOT built yet — Continue
              Learning links out to the existing pages/lesson.html or
              pages/quiz.html for now, same destinations
              pages/dashboard.html's own Continue card already uses.
    ─────────────────────────────────────────────────────────────────
  -->
