<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      try { if (JSON.parse(localStorage.getItem('lw-preferences') || '{}').reducedMotion) root.classList.add('lw-force-reduced-motion'); } catch (e) {}
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#F8FAFC' : '#0F172A';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Missions Pilot Preview | LinguaWave (dev)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/missions-preview.css" />
  <link rel="stylesheet" href="../css/missions-compare.css" />
  <script src="../js/icons.js"></script>
  <script src="../js/role-guard.js"></script>
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="icon" href="../assets/icon/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="../assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/icon/apple-touch-icon.png" />
</head>
<body>

  <div class="dev-shell">

    <div class="dev-devbar">
      <strong>Developer preview</strong> — Missions pilot mission. Not part of the real learner path.
      <a href="settings.html?dev=1" class="dev-devbar__link">&larr; Back to Settings</a>
    </div>

    <div class="container container--narrow section section--sm">

      <div class="dev-flagbar card" id="dev-flagbar">
      </div>

      <div class="devcmp-picker" id="dev-mission-picker">
        <label for="dev-mission-select"><strong>Mission:</strong></label>
        <select id="dev-mission-select"></select>
      </div>

      <div id="dev-root">
      </div>

    </div>
  </div>

  <script defer src="../js/missions.js"></script>
  <script src="../js/missions-preview.js"></script>
</body>
</html>
