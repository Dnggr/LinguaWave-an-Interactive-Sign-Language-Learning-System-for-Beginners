<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same theme-flash-prevention snippet every page in this repo uses.
       Must stay first in <head>. -->
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#F8FAFC' : '#0F172A';
    })();
  </script>
  <!--
    pages/progress.html — Progress page
    ─────────────────────────────────────────────────────────────────
    PURPOSE : Mission-based counterpart to pages/progress.html (the
              reference mockup's panel 10 — "Your Progress" ring +
              stat tiles, "Needs Review", "Progress by Level"). Same
              app shell as every other real page (dashboard.html
              / learn.html / mission-overview.html).

    DATA    : Sourced entirely from window.LWMissions (js/missions.js) —
              getAllMissions(), getMissionProgress(), getItemCompletedAt(),
              getStreakSummary(), getHeartsState(), getCategoryGroups() —
              plus window.LWData for sign titles. No hardcoded numbers.

    DIFFERENCES FROM THE MOCKUP, ON PURPOSE (same "don't fabricate
    data that doesn't exist" discipline js/progress-page.js documents
    for the v1 page):
      - "Progress by Level" -> "Progress by Chapter". Missions has no
        basic/medium/intermediate level grouping of its own (that's a
        js/data.js/js/engine/progress.js concept) — it organizes
        missions into the 12 named chapters from getCategoryGroups().
        Chapters with zero live missions built yet are left out rather
        than shown as a fake "0%".
      - "Needs Review": UNLIKE pages/progress.html (which has no
        timestamps and has to fall back to "most recently practiced"),
        Missions DOES record a real completedAt per item
        (getItemCompletedAt(), added Phase 2) — so this section shows
        signs whose LESSON item was actually completed 2+ days ago, a
        genuine (if simple) due rule, not a fabricated one. If nothing
        is old enough yet, the panel says so instead of padding the
        list with a made-up "3 days ago".
      - Two extra stat tiles beyond the mockup's three (Streak, Hearts)
        — both are real Missions-only concepts (js/missions.js's streak
        and Hearts modules) already surfaced elsewhere in
        (dashboard.html, mission-overview.html); showing them
        here too keeps this page consistent with the rest of rather
        than omitting data that already exists.

    CONNECTS : ← app sidebar (every real page)
               → mission-overview.html (chapter mission links)
               → pages/camera-practice.html (per-sign review links, same
                 pattern pages/progress.html's own review links use)
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Progress | LinguaWave</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/tour.css" />
</head>
<body data-tour="progress">

  <a href="#main" class="skip-link">Skip to Progress</a>

  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="dashboard.html" class="app-sidebar__logo">Lingua<span>Wave</span></a>
      <nav class="app-sidebar__nav">
        <a href="dashboard.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="dashboard"></span>
          Dashboard
        </a>
        <a href="learn.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="learn"></span>
          Learn
        </a>
        <a href="progress.html" class="app-sidebar__link active">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="progress"></span>
          Progress
        </a>
        <a href="feedback.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="feedback"></span>
          Feedback
        </a>
        <a href="settings.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="settings"></span>
          Settings
        </a>
      </nav>
      <div class="app-sidebar__foot">
        <button class="theme-switch" id="theme-toggle" type="button" role="switch"
                aria-checked="false" title="Switch to dark theme" aria-label="Switch to dark theme">
          <span class="theme-switch__check">
            <span data-lw-icon="theme_sun" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--sun"></span>
            <span data-lw-icon="theme_moon" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--moon"></span>
          </span>
        </button>
        <a href="#" class="btn btn--ghost btn--sm" data-logout="../index.html">Log out</a>
      </div>
    </aside>

    <div class="app-main" id="main">

      <section class="section section--sm section--tight">
        <div class="container">
          <h1>Your Progress</h1>
          <p class="text-muted mt-2">A full picture of how far you've come, mission by mission.</p>
        </div>
      </section>

      <section class="section section--sm">
        <div class="container">
          <!-- Grid now holds ONLY the hero row (ring + stats) beside
               Needs Review — "Progress by Chapter" used to live inside
               .progress-grid__main too, which meant its "70% width,
               centered" rules below were 70% of this narrow 1.7fr
               column, not 70% of the page, and left it sitting
               visibly left-shifted rather than centered. Moved below,
               outside the grid, so it centers/sizes against the same
               full-width .container as the grid itself. This also
               makes "cap Needs Review's height to the left card
               group" (js/progress-page.js's syncReviewCardHeight(), see
               css/app.css's .needs-review comment) literally
               true now — the left column IS the hero row, no chapter
               list hanging off the bottom of it to be ignored. -->
          <div class="progress-grid">

            <!-- ── LEFT COLUMN ─────────────────────────────────────── -->
            <div class="progress-grid__main">

              <!-- No "card" class here on purpose — the ring itself
                   sits outside any card background/border, matching
                   the reference mockup. js/progress-page.js's
                   renderHero() puts the actual .card on the stats
                   tiles only (#progress-stats-card), not on this
                   outer grid wrapper. -->
              <div class="progress-hero-row" id="progress-hero">
                <p class="text-muted loading-pulse">Loading your progress…</p>
              </div>

            </div>

            <!-- ── RIGHT COLUMN ────────────────────────────────────── -->
            <div class="progress-grid__side">
              <div class="card needs-review" id="needs-review">
                <p class="text-muted loading-pulse">Loading review signs…</p>
              </div>
            </div>

          </div>

          <!-- ── FULL-WIDTH ROW, below both columns ─────────────────
               #progress-chapters's own "width: 70%; margin-inline:
               auto" (css/app.css) now resolves against .container
               above, not the old narrow grid column. -->
          <h2 class="mt-8 mb-4 progress-chapters-heading">Progress by Chapter</h2>
          <div class="card unit-progress-list" id="progress-chapters">
            <p class="text-muted loading-pulse" style="padding: var(--space-4);">Loading chapter-by-chapter progress…</p>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
  <!--
    js/data.js dropped (migration-analysis pass) — this page's only
    use of window.LWData was a sign-title fallback in
    progress-page.js's signTitleFor(), which now reads window.LWMissions
    directly (SIGNS_V2 already carries its own title).
  -->
  <script src="../js/missions.js"></script>
  <!-- Shared icon system. Plain <script> (not a module) and NOT deferred:
       window.LWIcons must exist before any page script, inline script or
       module body runs, and before DOMContentLoaded hydrates any
       data-lw-icon="" markup below. See js/icons.js. -->
  <script src="../js/icons.js"></script>
  <script src="../js/theme.js" defer></script>
  <!-- ADDED (migration-analysis pass) — provides window.LinguaWave.showToast
       and, critically, wires up every [data-logout] button (the sidebar's
       Log out link had no handler at all before this, on ANY page). -->
  <script src="../js/main.js"></script>
  <script src="../js/progress-page.js"></script>
  <!-- Guided tour (NEW): what it says lives in js/tour-guides.js, how it runs in
       js/tour.js, how it looks in css/tour.css. This page opts in via
       <body data-tour="progress">. -->
  <script src="../js/tour-guides.js"></script>
  <script src="../js/tour.js"></script>
</body>
</html>
