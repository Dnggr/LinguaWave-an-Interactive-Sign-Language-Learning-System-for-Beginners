<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same theme-flash-prevention snippet every page in this repo uses.
       Must stay first in <head>. -->
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#FFF8F0' : '#1F1712';
    })();
  </script>
  <!--
    pages/lesson.html — Lesson (NEW)
    ─────────────────────────────────────────────────────────────────
    PURPOSE : The first real screen that walks a mission's own
              items (LESSON/BOOSTER/PRACTICE/QUIZ, unchanged shape
              from js/missions.js) using the six-stage loop from
              LinguaWaveV2_Learning_Psychology_Analysis.docx and its
              chapter-level follow-up: Watch → Recognize →
              Discriminate → Contextualize → (Produce, handed off) →
              Celebrate. All planning logic lives in
              js/lesson-loop.js; this page + js/lesson.js only
              render it and call the EXISTING js/missions.js progress
              functions (markItemComplete, getDropOffIndex, ...) — no
              new progress store.

    ENTRY   : ?mission=<categoryId> — same param convention every
              other page already uses.

    REPLACES: pages/mission-overview.html's "Start Mission" button
              used to link straight to ../pages/camera-practice.html (V1).
              It now links here instead; the Mastery Quiz button is
              UNCHANGED and still links to ../pages/quiz.html (V1)
              — this page does not touch the quiz engine.

    PRODUCE STAGE / KNOWN LIMITATION : camera-based sign production
              (js/camera-practice.js's detection engine) is NOT reimplemented
              here — that is a large, separate isolated system this
              revision deliberately does not touch. Each Watch-stage
              item instead offers an explicit "Practice with your
              camera" link out to the existing pages/camera-practice.html for
              that category (same page Start Mission used to open
              directly), opened in a new tab, clearly labeled rather
              than silently skipped. Likewise, the closing QUIZ item
              still hands off to pages/quiz.html exactly as Mission
              Overview already did — see Missions_LinguaWave_Progress_
              Tracker.md §5 open question 7 for the pre-existing (not
              introduced here) gap around when that item is marked
              complete.
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/learn.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>

  <a href="#lesson-main" class="skip-link">Skip to Lesson</a>

  <div class="app-shell">
    <aside class="app-sidebar">

      <nav class="app-sidebar__nav">

        <a href="learn.html" class="app-sidebar__link active">

          Learn

        <a href="feedback.html" class="app-sidebar__link">

        <a href="#" class="btn btn--ghost btn--sm" data-logout="../index.html">Log out</a>

    <div class="app-main" id="lesson-main">

      <section class="section section--sm section--tight">
        <div class="container container--narrow">
          <div class="lesson-topbar">
            <a href="mission-overview.html" id="lesson-exit" class="back-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
              Exit lesson
            </a>
            <!--
              Review nav (Priority 2, item 5) — ONLY unhidden by
              js/lesson.js when the mission is already 100% complete
              (window.LWMissions.getMissionProgress(mission) >= 1). Stays
              `hidden` (both the attribute and no inline style) for any
              in-progress/locked mission so it can never be used to
              skip ahead of required progression — see that file's
              renderItem()/updateReviewNav() for the single place this
              is decided, on every render (not just page load), so the
              buttons always reflect whichever item is on screen right
              now. Per explicit follow-up, this steps one item at a
              time (‹ Previous / Next ›) rather than jumping straight
              to the first/last item — js/lesson.js disables
              whichever side has no further item to step to.
            -->
            <div class="lesson-review-nav" id="lesson-review-nav" hidden>
              <span class="lesson-review-nav__label">Reviewing a completed mission</span>
              <button type="button" class="btn btn--ghost btn--sm lesson-review-nav__btn" id="lesson-nav-prev" aria-label="Previous item">&lsaquo;</button>
              <button type="button" class="btn btn--ghost btn--sm lesson-review-nav__btn" id="lesson-nav-next" aria-label="Next item">&rsaquo;</button>
            </div>
            <div class="lesson-track">
              <!--
                Task 2 — dot marker + Review-Mission full-bar behavior.
                .lesson-track__bar is a scoping class only (adds
                position:relative for the dot below) — the shared
                .progress-bar/.progress-bar__fill rules in
                css/style.css are untouched, so nowhere else that
                reuses them (Mission Overview's list rows, the Mastery
                Quiz's own .quiz-progress-bar) is affected. See
                js/lesson.js's updateTrack() for the fill%/dot%
                math (js/lesson.js is the single place that decides
                both).
              -->
              <div class="progress-bar lesson-track__bar">
                <div class="progress-bar__fill" id="lesson-track-fill" style="width:0%"></div>
                <div class="lesson-track__dot" id="lesson-track-dot" style="left:0%"></div>
              </div>
              <span class="lesson-track__label" id="lesson-track-label">Item 1 of 1</span>
            </div>
          </div>

          <div id="lesson-content">
            <!-- filled by js/lesson.js -->
            <p class="text-muted">Loading lesson…</p>
          </div>
        </div>
      </section>

    </div>
  </div>
