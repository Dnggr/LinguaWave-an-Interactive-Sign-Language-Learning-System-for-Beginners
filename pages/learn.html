<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      try { if (JSON.parse(localStorage.getItem('lw-preferences') || '{}').reducedMotion) root.classList.add('lw-force-reduced-motion'); } catch (e) {}
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#F8FAFC' : '#0F172A';
    })();
  </script>
  <!--
    pages/learn.html — Learning Path
    ─────────────────────────────────────────────────────────────────
    PURPOSE : "Your Learning Journey" list per the implementation
              guide's §4.3/§5 — heading, subtext, search field, then
              one ordered row per mission (number, title, one-line
              goal, status pill, progress, chevron). Sourced from
              window.LWMissions.getAllMissions() — see dashboard.html's
              header comment for the 65-vs-10-missions open question;
              this page shows all 65 live missions, not a hardcoded 10.

    ROW CLICK : each unlocked row currently links to the mission's
              existing quiz entry point (pages/quiz.html) as a
              stand-in "open this mission" destination — a real
              Mission Overview screen (guide §6) doesn't exist yet.
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Learn | LinguaWave</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- PERF FIX (this revision) — was a plain render-blocking
       <link rel="stylesheet">; see index.html's matching note for why. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" /></noscript>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/learn.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/tour.css" />
  <!-- Role guard: admin -> admin pages only, learners -> out of admin pages. Keep synchronous, in <head>. -->
  <script src="../js/role-guard.js"></script>
  <!-- Mobile/tablet layer — must stay after every other stylesheet. See css/responsive.css. -->
  <link rel="stylesheet" href="../css/responsive.css" />
  <script src="../js/mobile-nav.js" defer></script>
  <script src="../js/game-gate.js" defer></script>
  <link rel="stylesheet" href="../css/xp.css" />
</head>
<body data-tour="learn">

  <a href="#path-list" class="skip-link">Skip to learning path</a>

  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="dashboard.html" class="app-sidebar__logo">Lingua<span>Wave</span></a>
      <nav class="app-sidebar__nav">
        <a href="dashboard.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="dashboard"></span>
          Dashboard
        </a>
        <a href="learn.html" class="app-sidebar__link active">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="learn"></span>
          Learn
        </a>
        <a href="progress.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="progress"></span>
          Progress
        </a>
        <a href="game.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="5" rx="1"/><rect x="13" y="4" width="8" height="5" rx="1"/><rect x="3" y="11" width="5" height="5" rx="1"/><rect x="10" y="11" width="8" height="5" rx="1"/><path d="M4 20h16"/></svg></span>

        <a href="leaderboard.html" class="app-sidebar__link">

      <div class="app-sidebar__foot">
        <button class="theme-switch" id="theme-toggle" type="button" role="switch"
                aria-checked="false" title="Switch to dark theme" aria-label="Switch to dark theme">
          <span class="theme-switch__check">
            <span data-lw-icon="theme_sun" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--sun"></span>
            <span data-lw-icon="theme_moon" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--moon"></span>
          </span>
        </button>
        <a href="#" class="btn btn--ghost btn--sm" data-logout="../index.html">Log out</a>
      </div>
    </aside>

    <div class="app-main">

      <section class="section section--sm section--tight">
        <div class="container">
          <h1>Your Learning Journey</h1>
          <p class="mt-2 text-muted">Complete small communication goals and build your skills.</p>
        </div>
      </section>

      <section class="section section--sm">
        <div class="container container--narrow">
          <div class="path-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="path-search-input" placeholder="Search missions or topics" aria-label="Search missions or topics" />
          </div>

          <div id="orientation-slot">
            <!-- filled by js/learn.js — always visible, unaffected by search -->
          </div>

          <div class="path-list" id="path-list">
            <!-- filled by js/learn.js -->
          </div>
        </div>
      </section>

    </div>
  </div>

  <script src="../js/xp-config.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/xp.js"></script>
  <script defer src="../js/missions.js"></script>
  <!-- Shared icon system. Plain <script> (not a module) and NOT deferred:
       window.LWIcons must exist before any page script, inline script or
       module body runs, and before DOMContentLoaded hydrates any
       data-lw-icon="" markup below. See js/icons.js. -->
  <script src="../js/icons.js"></script>
  <script src="../js/theme.js" defer></script>
  <!-- ADDED (migration-analysis pass) — provides window.LinguaWave.showToast
       and, critically, wires up every [data-logout] button (the sidebar's
       Log out link had no handler at all before this, on ANY page). -->
  <script src="../js/main.js"></script>
  <script src="../js/learn.js"></script>
  <!-- Guided tour (NEW): what it says lives in js/tour-guides.js, how it runs in
       js/tour.js, how it looks in css/tour.css. This page opts in via
       <body data-tour="learn">. -->
  <script src="../js/tour-guides.js"></script>
  <script src="../js/tour.js"></script>
</body>
</html>
