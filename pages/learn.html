<!DOCTYPE html>
<html lang="en">
<head>
  <!-- NEW: sets data-theme before any CSS loads, so the page never
       flashes the wrong theme on load. Must stay first in <head>. -->
  <script>
    (function () {
      var saved = localStorage.getItem('lw-theme');
      var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!--
    pages/learn.html — Level & Lesson Selector
    ─────────────────────────────────────────────────────────────────
    PURPOSE  : Shows all lessons within a given level as a grid of
               cards.  Completed lessons show a green ✔, locked ones
               show a 🔒.  Clicking an unlocked card opens lesson.html.

    CONNECTS : ← dashboard.html  (via level card "View Lessons" link)
               → pages/lesson.html  (on lesson card click)

    URL PARAM: ?level=basic | medium | intermediate
               JS reads this to filter visible lessons.

    TODO     : Fetch real lesson metadata (title, locked state, image)
               from Firestore collection "lessons" filtered by level.
               Replace static lesson card list below with dynamic render.
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn — LinguaWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/learn.css" />

  <script type="module" src="../js/auth.js"></script>
  <script src="../js/theme.js" defer></script>
  <script>
  window.addEventListener('lwauth-ready', () => {
    LWAuth.requireAuth('../index.html');
  });
  </script>
</head>
<body>

  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="dashboard.html" class="navbar__logo">Lingua<span>Wave</span></a>
      <ul class="navbar__links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="learn.html" class="active">Learn</a></li>
      </ul>
      <div class="navbar__user">
        <button class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false"
                aria-label="Toggle light/dark theme">
          <span class="theme-toggle__thumb"></span>
        </button>
        <span>👋 <span data-user-name>Learner</span></span>
        <a href="#" class="btn btn--ghost btn--sm" data-logout="../index.html">Log out</a>
      </div>
    </div>
  </nav>

  <!-- ── LEVEL TABS ────────────────────────────────────────────── -->
  <section class="section section--sm">
    <div class="container">
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
      <h1 class="mt-4">Select a Lesson</h1>
      <p class="mt-2 text-muted">
        Choose your level below, then pick a category to start.
      </p>

      <!-- Level tab switcher — all three levels are unlocked; only a
           future "advanced" tier would stay gated. js/learn.js reads
           ?level= and re-renders the grid below on tab click. -->
      <div class="level-tabs mt-8">
        <button class="level-tab level-tab--active" data-level="basic">
          <span class="badge badge--basic">Basic</span> Letters
        </button>
        <button class="level-tab" data-level="medium">
          <span class="badge badge--medium">Medium</span> Words
        </button>
        <button class="level-tab" data-level="intermediate">
          <span class="badge badge--intermediate">Intermediate</span> Phrases
        </button>
      </div>
    </div>
  </section>

  <!-- ── CATEGORY / LESSON GRID ────────────────────────────────── -->
  <!-- js/learn.js renders this from window.LWData.CATEGORIES + SIGNS
       for whichever level tab is active. Basic renders the 26-letter
       alphabet grid directly (unchanged behaviour); Medium and
       Intermediate render one card per category — functional
       categories (comingSoon: false) link into the camera lesson,
       everything else shows a "Coming Soon" preview of its words. -->
  <section class="section section--sm">
    <div class="container">
      <div class="lesson-grid" id="lesson-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container"><p>LinguaWave — Capstone Project 2025</p></div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/engine/progress.js"></script>
  <script src="../js/learn.js"></script>
</body>
</html>
