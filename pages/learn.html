<!DOCTYPE html>
<html lang="en">
<head>
  <!-- NEW: sets data-theme before any CSS loads, so the page never
       flashes the wrong theme on load. Must stay first in <head>. -->
  <script>
    (function () {
      var saved = localStorage.getItem('lw-theme');
      var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!--
    pages/learn.html — Trail / Lesson Selector
    ─────────────────────────────────────────────────────────────────
    PURPOSE  : REV 4 — PHASE 4 (this revision): shows the single
               continuous "Basic ASL" trail — one node per
               window.LWData.getUnits() entry, locked/current/done —
               instead of the old three-tab (basic/medium/intermediate)
               level switcher + per-level card grid. Clicking an
               unlocked node opens that unit's screen (an info screen,
               a "pick a category" list, or straight into the category
               grid/picker), which then link into lesson.html on a
               specific sign. See js/learn.js's own header comment for
               the full breakdown of every view this page can show.

    CONNECTS : ← dashboard.html      (via "Continue Learning" + unit rows)
               ← pages/intro-to-asl.html (Unit 0's screen links back out here)
               → pages/lesson.html   (on a sign card click)
               → pages/quiz.html     (via a category's assessment CTA)

    URL PARAMS: this page's OWN navigation uses ?unit=<unitId> and
               ?category=<categoryId> (see js/learn.js's file header
               for the full scheme). The OLD
               ?level=basic|medium|intermediate[&category=Y] shape is
               STILL accepted on load for backward compatibility —
               js/lesson.js and js/quiz.js (both out of scope this
               phase) still build links in that shape and were not
               changed to match.

    TODO     : Fetch real lesson metadata (title, locked state, image)
               from Firestore collection "lessons".  Replace static
               SIGNS/CATEGORIES data with a dynamic render — UNCHANGED
               TODO carried over from before this revision.
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn — LinguaWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/learn.css" />

  <script type="module" src="../js/auth.js"></script>
  <script src="../js/theme.js" defer></script>
  <script>
  window.addEventListener('lwauth-ready', () => {
    LWAuth.requireAuth('../index.html');
  });
  </script>
</head>
<body>

  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="dashboard.html" class="navbar__logo">Lingua<span>Wave</span></a>
      <ul class="navbar__links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="learn.html" class="active">Learn</a></li>
      </ul>
      <div class="navbar__user">
        <button class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false"
                aria-label="Toggle light/dark theme">
          <span class="theme-toggle__thumb"></span>
        </button>
        <span>👋 <span data-user-name>Learner</span></span>
        <a href="#" class="btn btn--ghost btn--sm" data-logout="../index.html">Log out</a>
      </div>
    </div>
  </nav>

  <!-- ── TRAIL HEADER ──────────────────────────────────────────── -->
  <!-- REV 4 PHASE 4: the old three-button "level-tabs" switcher lived
       here (basic/medium/intermediate — see git history / AI_MEMORY.md
       if you need the old markup back). It's gone: js/learn.js now
       renders one continuous trail below instead of separate
       per-level screens, so there's nothing left to switch between at
       this level.

       #learn-context and #learn-back-link are NEW — js/learn.js
       shows/updates them per view: both stay hidden on the trail
       root, and once you're inside a unit or category, #learn-context
       becomes a small breadcrumb (e.g. the unit/category title) and
       #learn-back-link becomes a real, context-aware "back" link
       (back to the trail, or back to the unit's category list if you
       drilled in from one — see js/learn.js's setBack() for exactly
       which). This replaces the old in-grid "← Back to Categories"
       card that renderWordPicker() used to render as its own tile —
       one consistent back affordance for every screen instead of a
       different one depending which screen you're on. -->
  <section class="section section--sm">
    <div class="container">
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
      <h1 class="mt-4">Your ASL Learning Path</h1>
      <p class="mt-2 text-muted">
        One path from the alphabet to full phrases — work through it in order, or jump into anything you've already unlocked.
      </p>
      <p class="mt-2 text-muted" id="learn-context" style="display:none;"></p>
      <a href="#" class="back-link mt-2" id="learn-back-link" style="display:none;">← Back to Learning Path</a>
    </div>
  </section>

  <!-- ── TRAIL / UNIT / CATEGORY GRID ──────────────────────────── -->
  <!-- js/learn.js renders EVERY view (trail, Unit 0 info, a unit's
       category list, a category's grid/picker) into this same
       container, toggling the `trail` / `lesson-grid--categories`
       modifier classes per view. See js/learn.js's file header for
       the full state breakdown — this container used to only ever
       hold one level's worth of lesson/category cards; now it holds
       whatever the current trail position is. -->
  <section class="section section--sm">
    <div class="container">
      <div class="lesson-grid" id="lesson-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container"><p>LinguaWave — Capstone Project 2025</p></div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/data.js"></script>
  <script defer src="../js/engine/progress.js"></script>
  <script src="../js/learn.js"></script>
</body>
</html>
