<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    pages/register.html — User Registration (Auth Stub)
    ─────────────────────────────────────────────────────────────────
    PURPOSE  : Registration form collecting email, password, and
               starting proficiency level.  Currently a static stub —
               submit button only shows a placeholder alert.

    CONNECTS : ← index.html  (Get Started / Create Account CTA)
               → pages/dashboard.html  (on successful registration)
               → pages/login.html      (already have an account?)

    TODO     : js/auth.js — wire the form to Firebase Auth
               createUserWithEmailAndPassword().
               On success: create Firestore user document with
               { name, email, level, progress: {} }.
               Redirect to dashboard.html.
               Show inline error messages (email already in use, etc.).
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — LinguaWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="../index.html" class="navbar__logo" style="display:block;text-align:center;margin-bottom:2rem;">
      Lingua<span style="color:var(--clr-text-muted);font-weight:400;">Wave</span>
    </a>

    <h2>Create your account</h2>
    <p class="text-muted mt-4">Start learning ASL today — it's free.</p>

    <!-- STUB: no real submission yet -->
    <div class="auth-form mt-8">

      <div class="form-group">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" class="form-input" placeholder="Alex Santos" autocomplete="name" />
      </div>

      <div class="form-group mt-4">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group mt-4">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Min. 8 characters" autocomplete="new-password" />
      </div>

      <div class="form-group mt-4">
        <label for="reg-level">Starting level</label>
        <select id="reg-level" class="form-input">
          <option value="basic">Beginner — I'm just starting</option>
          <option value="medium">Intermediate — I know some signs</option>
          <option value="advanced">Advanced — I know the alphabet</option>
        </select>
        <small class="text-muted">You can change this later from your dashboard.</small>
      </div>

      <!-- TODO: replace onclick with real Firebase Auth call in js/auth.js -->
      <button
        class="btn btn--primary btn--full btn--lg mt-8"
        onclick="alert('Auth not yet implemented. Redirecting to dashboard for demo.'); window.location=\'dashboard.html\'';"
      >
        Create Account
      </button>

      <p class="text-center text-muted mt-4" style="font-size: var(--fs-sm);">
        Already have an account? <a href="login.html">Log in →</a>
      </p>

    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
