<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same theme-flash-prevention snippet every page in this repo uses.
       Must stay first in <head>. -->
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#F8FAFC' : '#0F172A';
    })();
  </script>
  <!--
    pages/mastery-quiz.html — Mastery Quiz (NEW)
    ─────────────────────────────────────────────────────────────────
    PURPOSE : A real-native Mastery Quiz screen, replacing the
              hand-off to V1's pages/quiz.html — now covering all 12
              chapters (see SCOPE below). Reuses the SAME mission.items
              QUIZ concept js/missions.js already builds (unchanged
              shape); this page just walks it as its own dedicated
              screen instead of leaving the Mastery Quiz on the
              untouched V1 engine.

    SCOPE (widened this revision — merged from three parallel
              widenings) : gated in js/mastery-quiz.js, now covering
              ALL 12 chapters — Chapter 1 (ASL Foundations), Chapter 2
              (Introduce Yourself), Chapter 3 (Express How You Feel),
              Chapter 4 (Daily Actions & Communication), Chapter 5
              (Describing People & Things), Chapter 6 (Home & Family),
              Chapter 7 (School Life), Chapter 8 (Food & Nature),
              Chapter 9 (Clothing & Belongings), Chapter 10 (People,
              Places & Time), Chapter 11 (Having a Conversation), and
              Chapter 12 (Putting It All Together) — WIDENED this
              revision from the original Chapters 1-2, merging three
              separate widenings (3-5, 6-8, and 9-12) rather than
              keeping any of them partial. Only Chapters 1-2 have
              hand-curated NEAR_NEIGHBORS/discrimination data in
              js/lesson-loop.js — Chapters 3-12 run on that file's
              existing generic (non-curated) distractor fallback, same
              as every other uncurated chapter's lesson flow already
              does. With every chapter now sampled, the V1
              pages/quiz.html hand-off is currently unreachable from
              any real mission link — it remains only as a defensive
              fallback (stale link, typed URL, or a future new chapter
              not yet added to the gate), same "degrade, don't throw"
              discipline as the rest of Missions — see this file's own js
              for the exact gate and how to widen it further.

    ENTRY   : ?mission=<categoryId> — same param convention every
              other page uses.

    CLOSES TWO STANDING GAPS (see Missions_LinguaWave_Progress_Tracker.md
              §5 open question 7, and AI_MEMORY.md's Lesson-engine
              session note):
                1. Hearts are now spent on quiz SUBMIT, not attempt
                   START (every other chapter's Start Mastery Quiz
                   button, in mission-overview.js/lesson.js,
                   still spends on start — untouched, out of this
                   sample's scope).
                2. Passing now actually calls markItemComplete() on
                   the mission's QUIZ item, so mission %/chapter
                   progress/the Missions Completed stat on
                   progress.html can finally reach 100% for a
                   sampled chapter's mission.

    NOT BUILT HERE : the Optional Camera Check V1's quiz.html has is a
              deliberate, explicit omission — it was never part of the
              original mockup spec for the Quiz screen (flagged as
              V1-only "extra" in LinguaWave_Mockup_Visual_Audit.md
              §8) and this build keeps's Mastery Quiz MC-only.
    ─────────────────────────────────────────────────────────────────
  -->
