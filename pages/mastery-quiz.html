<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      try { if (JSON.parse(localStorage.getItem('lw-preferences') || '{}').reducedMotion) root.classList.add('lw-force-reduced-motion'); } catch (e) {}
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#F8FAFC' : '#0F172A';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mastery Quiz | LinguaWave</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/learn.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/tour.css" />
  <script src="../js/role-guard.js"></script>
  <link rel="stylesheet" href="../css/responsive.css" />
  <script src="../js/mobile-nav.js" defer></script>
  <script src="../js/game-gate.js" defer></script>
  <link rel="stylesheet" href="../css/xp.css" />
  <link rel="icon" href="../assets/icon/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="../assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/icon/apple-touch-icon.png" />
</head>
<body data-tour="mastery-quiz">

  <div class="app-shell">

        <a href="learn.html" class="app-sidebar__link active">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="learn"></span>

          Game
        </a>
        <a href="leaderboard.html" class="app-sidebar__link">

        <button class="theme-switch" id="theme-toggle" type="button" role="switch"

          <span class="theme-switch__check">
            <span data-lw-icon="theme_sun" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--sun"></span>
            <span data-lw-icon="theme_moon" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--moon"></span>

          </div>
        </div>
      </section>

    </div>
  </div>

  <script src="../js/xp-config.js"></script>
