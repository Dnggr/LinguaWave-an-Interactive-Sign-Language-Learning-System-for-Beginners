<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      // Paints the correct background INSTANTLY, without waiting on
      // css/style.css to finish loading/parsing — this is the part
      // that actually stops the white flash on reload/navigation.
      root.style.background = resolved === 'light' ? '#FFF8F0' : '#1F1712';
    })();
  </script>
  <!--
    pages/settings.html — Profile & Preferences (NEW)
    ─────────────────────────────────────────────────────────────────
    PURPOSE  : Reference-board layout pass, panel 12. Learner profile
               card + app preferences (theme, notifications, sound
               effects) + log out.

    REUSES   : css/style.css's .card/.form-input/.btn (profile card,
               Edit Profile), the new .toggle-switch component (§18)
               for Notifications/Sound Effects, and the existing
               .theme-switch for the Theme row so it stays the single
               source of truth for theme state (no second toggle
               fighting js/theme.js's localStorage-backed one).

    DATA     : #settings-user-name is filled by js/main.js like every
               other authenticated page (data-user-name). Notifications
               / Sound Effects / Reduced Motion are wired to
               localStorage by js/settings-page.js, same tier of
               persistence as js/theme.js's own theme toggle — no
               server-side "preferences" doc exists in this repo (see
               that file's header for why). #settings-user-email stays
               a static placeholder (no email field exists on
               window.LWAuth's exposed surface; js/auth.js itself is
               out of scope, not opened). Edit Profile has no
               destination screen yet — clicking it just logs a note,
               see js/settings-page.js.

    CONNECTS : ← app sidebar (every authenticated page)
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — LinguaWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <script type="module" src="../js/auth.js"></script>
  <script src="../js/theme.js" defer></script>
  <script>
  window.addEventListener('lwauth-ready', () => {
    LWAuth.requireAuth('../index.html');
  });
  </script>
  <style>
    /* Page-scoped: profile card + preference-row layout only.
       Everything else reuses css/style.css as-is. */
    .profile-card { display: flex; align-items: center; gap: var(--space-6); flex-wrap: wrap; }
    .profile-card__avatar {
      width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
      background: var(--clr-accent-soft); color: var(--clr-accent);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 700;
    }
    .profile-card__info { flex: 1; min-width: 200px; }
    .profile-card__email { color: var(--clr-text-muted); font-size: var(--fs-sm); margin-top: var(--space-1); }
    .pref-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4) 0; border-bottom: 1px solid var(--clr-border);
    }
    .pref-row:last-child { border-bottom: none; }
    .pref-row__label { font-size: var(--fs-sm); font-weight: 600; color: var(--clr-text); }
  </style>
</head>
<body>

  <a href="#settings-preferences" class="skip-link">Skip to preferences</a>

  <!-- ── APP SHELL (sidebar nav — see css/style.css §17) ────────── -->
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="dashboard.html" class="app-sidebar__logo">Lingua<span>Wave</span></a>
      <nav class="app-sidebar__nav">
        <a href="dashboard.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span>
          Dashboard
        </a>
        <a href="learn.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          Learn
        </a>
        <a href="progress.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          Progress
        </a>
        <a href="quiz.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
          Quiz
        </a>
        <a href="feedback.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4.2-1.1L3 20l1.1-5.3A8.38 8.38 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/></svg></span>
          Feedback
        </a>
        <a href="settings.html" class="app-sidebar__link active">
          <span class="app-sidebar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          Settings
        </a>
      </nav>
      <div class="app-sidebar__foot">
        <button class="theme-switch" id="theme-toggle" type="button" role="switch"
                aria-checked="false" title="Switch to dark theme" aria-label="Switch to dark theme">
          <span class="theme-switch__check">
            <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
        <a href="#" class="btn btn--ghost btn--sm" data-logout="../index.html">Log out</a>
      </div>
    </aside>

    <div class="app-main">

      <section class="section section--sm">
        <div class="container container--narrow">
          <h1>Settings</h1>
          <p class="text-muted mt-2">Your profile and app preferences.</p>

          <!-- ── PROFILE CARD ────────────────────────────────────── -->
          <div class="card mt-8 profile-card">
            <div class="profile-card__avatar" aria-hidden="true" id="settings-avatar-initial" data-user-initial></div>
            <div class="profile-card__info">
              <div class="fs-lg" style="font-weight:700;" id="settings-user-name" data-user-name>—</div>
              <div class="profile-card__email" id="settings-user-email" data-user-email>—</div>
            </div>
            <button class="btn btn--secondary" id="btn-edit-profile">Edit Profile</button>
          </div>

          <!-- ── PREFERENCES ──────────────────────────────────────── -->
          <div class="card mt-6" id="settings-preferences" tabindex="-1">
            <h2 class="mb-2">Preferences</h2>

            <div class="pref-row">
              <span class="pref-row__label">Theme</span>
              <!-- CHANGED — was a Light/Dark-only <select>. Replaced with
                   a 3-way System/Light/Dark segmented control (same
                   pattern as Claude's own Settings → Appearance), so
                   "follow my OS" is a real option again, not just the
                   unlabeled first-visit fallback. Wired by
                   js/theme.js's applyTheme()/syncSegmentedControls() —
                   same single source of truth as the sidebar's quick
                   .theme-switch switch, not a second theme mechanism.
                   See js/settings-page.js for the read-on-load half. -->
              <div class="theme-segmented" id="theme-segmented-settings" role="radiogroup" aria-label="Theme">
                <button type="button" class="theme-segmented__opt" data-theme-value="system" role="radio" aria-checked="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  System
                </button>
                <button type="button" class="theme-segmented__opt" data-theme-value="light" role="radio" aria-checked="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                  Light
                </button>
                <button type="button" class="theme-segmented__opt" data-theme-value="dark" role="radio" aria-checked="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                  Dark
                </button>
              </div>
            </div>

            <div class="pref-row">
              <span class="pref-row__label">Notifications</span>
              <label class="toggle-switch">
                <input type="checkbox" id="pref-notifications" checked />
                <span class="toggle-switch__track"></span>
                <span class="toggle-switch__thumb"></span>
              </label>
            </div>

            <div class="pref-row">
              <span class="pref-row__label">Sound Effects</span>
              <label class="toggle-switch">
                <input type="checkbox" id="pref-sound-effects" checked />
                <span class="toggle-switch__track"></span>
                <span class="toggle-switch__thumb"></span>
              </label>
            </div>

            <div class="pref-row">
              <span class="pref-row__label">Reduced Motion</span>
              <label class="toggle-switch">
                <input type="checkbox" id="pref-reduced-motion" />
                <span class="toggle-switch__track"></span>
                <span class="toggle-switch__thumb"></span>
              </label>
            </div>
          </div>

          <div class="text-center mt-8">
            <a href="#" class="text-muted" data-logout="../index.html" style="font-size: var(--fs-sm);">Log Out</a>
          </div>

        </div>
      </section>

      <footer class="footer">
        <div class="container"><p>LinguaWave — Capstone Project 2026</p></div>
      </footer>

    </div><!-- /.app-main -->
  </div><!-- /.app-shell -->

  <script src="../js/main.js"></script>
  <script src="../js/settings-page.js"></script>
</body>
</html>
