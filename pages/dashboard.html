<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same theme-flash-prevention snippet every page in this repo uses.
       Must stay first in <head>. -->
  <script>
    (function () {
      var pref = localStorage.getItem('lw-theme') || 'system';
      var resolved = pref === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.setAttribute('data-theme-pref', pref);
      root.style.colorScheme = resolved;
      root.style.background = resolved === 'light' ? '#F8FAFC' : '#0F172A';
    })();
  </script>
  <!--
    pages/dashboard.html — Mission-Based Dashboard
    ─────────────────────────────────────────────────────────────────
    REBUILD (blue-teal mockup alignment pass) — this page used to be a
    "Continue Your Mission" hero-row + a flat mission "journey rail"
    (see git history for that version). Rebuilt to match the reference
    mockup's Dashboard screen: greeting header, a big "Today's Mission"
    banner, a "Your Progress" ring card, a "Learning Path" icon-tile
    grid, and a "Recommended for You" quick-link grid. Same app shell
    (sidebar/header/.card tokens) as pages/learn.html and
    pages/progress.html, and the same underlying data source
    (window.LWMissions) those two pages already use — nothing here is
    a new/parallel progress store.

    DATA    : Every number on this page (mission title/goal, ring %,
              chapter, missions-complete count, streak, hearts,
              per-tile fraction/status) comes from
              window.LWMissions.getAllMissions() and its related
              accessors — no hardcoded values. See js/dashboard.js's
              file header for the one exception (Recommended for You's
              static copy/icons, same treatment index.html's own
              feature cards already get) and why every one of ITS
              links is still a real, built destination.
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard | LinguaWave</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/tour.css" />
</head>
<body data-tour="dashboard">

  <a href="#main" class="skip-link">Skip to Dashboard</a>

  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="dashboard.html" class="app-sidebar__logo">Lingua<span>Wave</span></a>
      <nav class="app-sidebar__nav">
        <a href="dashboard.html" class="app-sidebar__link active">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="dashboard"></span>
          Dashboard
        </a>
        <a href="learn.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="learn"></span>
          Learn
        </a>
        <a href="progress.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="progress"></span>
          Progress
        </a>
        <a href="feedback.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="feedback"></span>
          Feedback
        </a>
        <a href="settings.html" class="app-sidebar__link">
          <span class="app-sidebar__icon" aria-hidden="true" data-lw-icon="settings"></span>
          Settings
        </a>
      </nav>
      <div class="app-sidebar__foot">
        <button class="theme-switch" id="theme-toggle" type="button" role="switch"
                aria-checked="false" title="Switch to dark theme" aria-label="Switch to dark theme">
          <span class="theme-switch__check">
            <span data-lw-icon="theme_sun" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--sun"></span>
            <span data-lw-icon="theme_moon" data-lw-icon-self="1" data-lw-icon-class="theme-switch__icon theme-switch__icon--moon"></span>
          </span>
        </button>
        <a href="#" class="btn btn--ghost btn--sm" data-logout="../index.html">Log out</a>
      </div>
    </aside>

    <div class="app-main" id="main">

      <!-- ── Greeting ─────────────────────────────────────────────── -->
      <section class="section section--sm section--tight">
        <div class="container">
          <div class="dash-greeting">
            <h1><span id="dash-greeting-word">Good morning,</span><!-- BUGFIX (light-mode UX pass) — the h1 is a flex container with a gap, so a bare "!" text node became its own flex item and rendered as "rene !". Name + "!" now share one span. --><span><span data-user-name>Learner</span>!</span> <span class="dash-greeting__wave" aria-hidden="true">👋</span></h1>
            <p class="mt-2 text-muted">Small steps make big progress. Keep going!</p>
          </div>
        </div>
      </section>

      <!-- ── Today's Mission + Your Progress ─────────────────────── -->
      <section class="section section--sm section--tight">
        <div class="container">
          <div class="dash-hero-grid">
            <div class="mission-banner" id="mission-banner">
              <!-- filled by js/dashboard.js -->
            </div>
            <div class="card progress-card" id="progress-card">
              <!-- filled by js/dashboard.js -->
            </div>
          </div>
        </div>
      </section>

      <!-- ── Learning Path ────────────────────────────────────────── -->
      <section class="section section--sm section--tight">
        <div class="container">
          <div class="section-heading-row">
            <h2>Learning Path</h2>
            <a href="learn.html" class="section-heading-row__link">View All</a>
          </div>
          <div class="learning-path-grid" id="learning-path-grid">
            <!-- filled by js/dashboard.js -->
          </div>
        </div>
      </section>

      <!-- ── Recommended for You ──────────────────────────────────── -->
      <section class="section section--sm">
        <div class="container">
          <div class="section-heading-row">
            <h2>Recommended for You</h2>
          </div>
          <div class="recommended-grid" id="recommended-grid">
            <!-- filled by js/dashboard.js -->
          </div>
        </div>
      </section>

    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
  <script src="../js/missions.js"></script>
  <!-- Shared icon system. Plain <script> (not a module) and NOT deferred:
       window.LWIcons must exist before any page script, inline script or
       module body runs, and before DOMContentLoaded hydrates any
       data-lw-icon="" markup below. See js/icons.js. -->
  <script src="../js/icons.js"></script>
  <script src="../js/theme.js" defer></script>
  <!-- ADDED (migration-analysis pass) — provides window.LinguaWave.showToast
       and, critically, wires up every [data-logout] button (the sidebar's
       Log out link had no handler at all before this, on ANY page). -->
  <script src="../js/main.js"></script>
  <script src="../js/dashboard.js"></script>
  <!-- Guided tour (NEW): what it says lives in js/tour-guides.js, how it runs in
       js/tour.js, how it looks in css/tour.css. This page opts in via
       <body data-tour="dashboard">. -->
  <script src="../js/tour-guides.js"></script>
  <script src="../js/tour.js"></script>
</body>
</html>
