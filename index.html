<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    index.html — Log In / Sign Up (Landing Page)
    ─────────────────────────────────────────────────────────────────
    PURPOSE  : This is now the ONLY entry point to the app. There is
               no separate marketing landing page — visitors land
               directly on Log In, with a Sign Up tab right next to
               it. Logged-in users are bounced straight to the
               dashboard before this page even renders.

    CONNECTS : → pages/dashboard.html  (after login/register)

    AUTH MODE: js/auth.js is currently in BYPASS mode — the Log In
               and Sign Up buttons accept whatever is typed (or
               nothing) and log you straight in. See js/auth.js for
               the 4 functions to swap with real Firebase Auth calls.
    ─────────────────────────────────────────────────────────────────
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaWave — Learn ASL Sign Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/toast.css" />

  <!-- Elfa Auth must load before anything renders so a logged-in user
       gets redirected immediately instead of seeing the login form. -->
  <script type="module" src="js/auth.js"></script>
  <script>
    window.addEventListener('lwauth-ready', () => {
    LWAuth.redirectIfLoggedIn('pages/dashboard.html');
   });
  </script>
</head>
<body class="auth-page">

  <div class="auth-card">

    <a href="index.html" class="navbar__logo" style="display:block;text-align:center;">
      Lingua<span style="color:var(--clr-text-muted);font-weight:400;">Wave</span>
    </a>
    <p class="auth-tagline">Learn ASL — one sign at a time.</p>

    <!-- ── TAB TOGGLE ───────────────────────────────────────────── -->
    <div class="auth-tabs">
      <button class="auth-tab auth-tab--active" id="tab-login" onclick="showAuthTab('login')">Log In</button>
      <button class="auth-tab" id="tab-register" onclick="showAuthTab('register')">Sign Up</button>
    </div>

    <!-- ── LOG IN FORM ──────────────────────────────────────────── -->
    <form class="auth-form" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" class="form-input" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group mt-4">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn--primary btn--full btn--lg mt-8">Log In</button>
      <p class="auth-switch text-muted">
        Don't have an account? <a href="#" onclick="showAuthTab('register'); return false;">Sign up free →</a>
      </p>
    </form>

    <!-- ── REGISTER FORM ────────────────────────────────────────── -->
    <form class="auth-form" id="register-form" style="display:none;" onsubmit="event.preventDefault(); handleRegister();">
      <div class="form-group">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" class="form-input" placeholder="Alex Santos" autocomplete="name" />
      </div>
      <div class="form-group mt-4">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group mt-4">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Min. 8 characters" autocomplete="new-password" />
      </div>
      <div class="form-group mt-4">
        <label for="reg-level">Starting level</label>
        <select id="reg-level" class="form-input">
          <option value="basic">Beginner — I'm just starting</option>
          <option value="medium">Intermediate — I know some signs</option>
          <option value="intermediate">Advanced — I know the alphabet</option>
        </select>
        <small class="text-muted">You can change this later from your dashboard.</small>
      </div>
      <button type="submit" class="btn btn--primary btn--full btn--lg mt-8">Create Account</button>
      <p class="auth-switch text-muted">
        Already have an account? <a href="#" onclick="showAuthTab('login'); return false;">Log in →</a>
      </p>
    </form>

  </div>
  
  <div id="auth-modal" class="auth-modal hidden">
    <div class="auth-modal__box">
      <p id="auth-modal-message" class="auth-modal__message"></p>
      <button id="auth-modal-close" class="btn btn--primary btn--full">OK</button>
    </div>
  </div>
  
  <script src="js/main.js"></script>
  <script>
    'use strict';

    function showAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('login-form').style.display    = isLogin ? 'flex' : 'none';
      document.getElementById('register-form').style.display  = isLogin ? 'none' : 'flex';
      document.getElementById('tab-login').classList.toggle('auth-tab--active', isLogin);
      document.getElementById('tab-register').classList.toggle('auth-tab--active', !isLogin);
    }

    // BYPASS MODE: no validation against a backend yet — see js/auth.js.
    async function handleLogin() {
      const email    = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        await LWAuth.login(email, password);
        window.location.href = 'pages/dashboard.html';
      } catch (error) {
        //alert(error.message)
        showAuthModal(error.message)
      }
    }

    async function handleRegister() {
      const name     = document.getElementById('reg-name').value;
      const email    = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const level    = document.getElementById('reg-level').value;
      try {
        await LWAuth.register(name, email, password, level);
        window.location.href = 'pages/dashboard.html';
      } catch (error) {
        //alert(error.message)
        showAuthModal(error.message)
      }
    }
    
     const authModal = document.getElementById('auth-modal');
     const authModalMessage = document.getElementById('auth-modal-message');
     const authModalClose = document.getElementById('auth-modal-close');

     function showAuthModal(message) {
       authModalMessage.textContent = message;
       authModal.classList.remove('hidden');
     }

     authModalClose.addEventListener('click', () => {
       authModal.classList.add('hidden');
     });
  </script>
</body>
</html>
